name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    name: Discover targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The matrix comes straight from settings.gradle, so new versions are picked up automatically.
      - name: Read targets from settings.gradle
        id: list
        run: |
          matrix=$(bash scripts/ci/list-targets.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Found $(jq length <<<"$matrix") targets"
          {
            echo "### Build targets"
            echo
            echo "| Minecraft | Loader | Project |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.minecraft) | \(.loader_name) | `:\(.target)` |"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.minecraft }} · ${{ matrix.loader_name }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 21 is the toolchain for 1.21.x; 25 is listed last so it becomes JAVA_HOME for the Gradle daemon and 26.x.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew ":$TARGET:build" --configure-on-demand --stacktrace

      - name: Server smoke test
        run: bash scripts/ci/server-smoke-test.sh "$TARGET"

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: tablist-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
            !versions/${{ matrix.target }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/smoke-test/
            versions/${{ matrix.target }}/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Single status check to mark as required in branch protection.
  all-targets:
    name: All targets
    needs: [targets, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix results
        env:
          TARGETS_RESULT: ${{ needs.targets.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Discover targets: $TARGETS_RESULT"
          echo "Build and smoke test: $TEST_RESULT"
          if [[ $TARGETS_RESULT != success || $TEST_RESULT != success ]]; then
            echo "::error::Not every Minecraft version / loader built and passed the server smoke test."
            exit 1
          fi
