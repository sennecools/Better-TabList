pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.kikugie.dev/snapshots' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.3'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        version '1.21-fabric', '1.21'
        version '1.21-neoforge', '1.21'
        version '1.21.1-fabric', '1.21.1'
        version '1.21.1-neoforge', '1.21.1'
        version '1.21.2-fabric', '1.21.2'
        version '1.21.2-neoforge', '1.21.2'
        version '1.21.3-fabric', '1.21.3'
        version '1.21.3-neoforge', '1.21.3'
        version '1.21.4-fabric', '1.21.4'
        version '1.21.4-neoforge', '1.21.4'
        version '1.21.5-fabric', '1.21.5'
        version '1.21.5-neoforge', '1.21.5'
        version '1.21.6-fabric', '1.21.6'
        version '1.21.6-neoforge', '1.21.6'
        version '1.21.7-fabric', '1.21.7'
        version '1.21.7-neoforge', '1.21.7'
        version '1.21.8-fabric', '1.21.8'
        version '1.21.8-neoforge', '1.21.8'
        version '1.21.9-fabric', '1.21.9'
        version '1.21.9-neoforge', '1.21.9'
        version '1.21.10-fabric', '1.21.10'
        version '1.21.10-neoforge', '1.21.10'
        version '1.21.11-fabric', '1.21.11'
        version '1.21.11-neoforge', '1.21.11'
        version '26.1-fabric', '26.1'
        version '26.1-neoforge', '26.1'
        version '26.1.1-fabric', '26.1.1'
        version '26.1.1-neoforge', '26.1.1'
        version '26.1.2-fabric', '26.1.2'
        version '26.1.2-neoforge', '26.1.2'
        version '26.2-fabric', '26.2'
        version '26.2-neoforge', '26.2'
        version '26.3-fabric', '26.3'
        version '26.3-neoforge', '26.3'

        // Minecraft 26.1+ ships unobfuscated, so Fabric needs the non-remapping Loom plugin.
        mapBuilds { _, data ->
            def loader = data.project.toString().split('-').last()
            def unobfuscated = !data.version.toString().startsWith('1.')
            loader == 'fabric' && unobfuscated ? 'fabric-unobfuscated.gradle' : loader + '.gradle'
        }

        vcsVersion = '1.21.1-fabric'
    }
}

rootProject.name = 'Better-TabList'
